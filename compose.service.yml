name: ember-service
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-ember_service}
      POSTGRES_DB: ${PG_DB:-ember_service}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Generate deploy/service.env first}
    volumes:
      - service_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  ember:
    image: ${EMBER_SERVICE_IMAGE:-ember-service:local}
    build: .
    env_file:
      - ${EMBER_SERVICE_ENV:-./deploy/service.env}
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      ENABLE_NEO4J: "False"
    ports:
      - "${EMBER_BIND_HOST:-127.0.0.1}:${EMBER_SERVICE_PORT:-8080}:8000"
    volumes:
      - service_world:/runtime
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    stop_grace_period: 5m
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  service_pg:
  service_world:
